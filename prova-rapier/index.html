<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prova fisica Rapier</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--fg:#f4efe6;--red:#d7262b;--yel:#f2c230;--grn:#7cc35a;--card:rgba(14,14,16,.82)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Barlow Condensed',system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:max(12px,env(safe-area-inset-left));top:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:2;right:12px;pointer-events:none}
.box{background:var(--card);border:1px solid rgba(255,255,255,.12);border-left:3px solid var(--red);border-radius:12px;padding:6px 12px;font-weight:700;font-size:18px;letter-spacing:.02em}
.box small{display:block;font-weight:500;font-size:12px;opacity:.75}
#kmh{font-size:26px}
.btns{position:fixed;top:64px;left:max(12px,env(safe-area-inset-left));display:flex;gap:8px;flex-wrap:wrap;z-index:3;max-width:70vw}
button{font-family:inherit;font-weight:700;font-size:15px;letter-spacing:.03em;color:var(--fg);background:var(--card);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:9px 13px;text-transform:uppercase}
button.on{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red);background:rgba(120,15,18,.6)}
.ped{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));width:min(26vw,170px);height:min(42vh,230px);border-radius:18px;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:26px;background:var(--card);touch-action:none}
.ped small{font-size:13px;font-weight:500;opacity:.8;text-align:center;padding:0 6px}
#gas{right:max(14px,env(safe-area-inset-right));border:3px solid var(--grn)}
#brk{left:max(14px,env(safe-area-inset-left));border:3px solid var(--red)}
#gfill{position:absolute;left:0;right:0;bottom:0;background:rgba(124,195,90,.28);border-radius:0 0 15px 15px;height:0}
#steer{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(34vw,260px);height:64px;border-radius:32px;background:var(--card);border:1px solid rgba(255,255,255,.2);z-index:3;touch-action:none}
#knob{position:absolute;top:6px;left:calc(50% - 26px);width:52px;height:52px;border-radius:50%;background:var(--yel)}
#tip{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--card);padding:10px 16px;border-radius:12px;font-size:18px;text-align:center;z-index:4;opacity:0;transition:opacity .3s;pointer-events:none;max-width:80vw}
#tip.show{opacity:1}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9;font-size:24px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div class="box"><span id="kmh">0</span> km/h<small id="gear">RIDOTTE</small></div>
  <div class="box"><span id="where">Partenza</span><small id="tilt">beccheggio 0° · rollio 0°</small></div>
  <div class="box"><span id="wl">● ● ● ●</span><small>ruote che spingono</small></div>
</div>
<div class="btns">
  <button id="bLow" class="on">Ridotte</button>
  <button id="bLR">Bloccaggio post.</button>
  <button id="bLF">Bloccaggio ant.</button>
  <button id="bVeh">Mezzo: Terrano</button>
  <button id="bCam">Camera</button>
  <button id="bRst">Ricomincia</button>
</div>
<div id="brk" class="ped">FRENO<small>tieni da fermo = retro</small></div>
<div id="gas" class="ped"><div id="gfill"></div>GAS<small>premi più in alto = più gas</small></div>
<div id="steer"><div id="knob"></div></div>
<div id="tip"></div>
<div id="load">Carico la fisica…</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">

const scene = new THREE.Scene(); scene.background = new THREE.Color(0xa9c3d6); scene.fog = new THREE.Fog(0xa9c3d6, 60, 240);

const cvT = (w, h, f, rep) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); f(g, w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; if (rep) t.repeat.set(rep[0], rep[1]); return t; };

const world3 = new THREE.Group(); scene.add(world3);
const carG = new THREE.Group(); scene.add(carG);
let bodyModel = null;
new GLTFLoader().load('terrano.glb', g => { const b = g.scene.getObjectByName('T_BODY') || g.scene; b.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); bodyModel = b; buildCar(); }, undefined, () => { bodyModel = null; buildCar(); });

function buildWorld() {

  const { W, L, ground, statics } = S; const nx = 161, nz = 881; const g = new THREE.PlaneGeometry(W, L, nx - 1, nz - 1); g.rotateX(-Math.PI / 2);

const tq = new THREE.Quaternion(), tv = new THREE.Vector3();

// ---------- comandi ----------
const inp = { gas: 0, brk: 0, steer: 0, rev: false }; const key = {};
addEventListener('keydown', e => { key[e.key.toLowerCase()] = 1; }); addEventListener('keyup', e => { key[e.key.toLowerCase()] = 0; });

{ const el = $('#steer'), kn = $('#knob'); const h = e => { e.preventDefault(); const r = el.getBoundingClientRect(); const t = (e.touches ? e.touches[0] : e); const v = Math.max(-1, Math.min(1, (t.clientX - (r.left + r.width / 2)) / (r.width / 2 - 26))); inp.steer = v; kn.style.left = `calc(50% - 26px + ${v * (r.width / 2 - 26)}px)`; }; const end = e => { e.preventDefault(); inp.steer = 0; kn.style.left = 'calc(50% - 26px)'; };
  el.addEventListener('touchstart', h, { passive: false }); el.addEventListener('touchmove', h, { passive: false }); el.addEventListener('touchend', end); el.addEventListener('mousedown', e => { h(e); const mv = ev => h(ev); const up = ev => { end(ev); removeEventListener('mousemove', mv); removeEventListener('mouseup', up); }; addEventListener('mousemove', mv); addEventListener('mouseup', up); }); }
const tip = (t) => { const e = $('#tip'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 2600); };
$('#bLow').onclick = () => { S.st.low = !S.st.low; $('#bLow').classList.toggle('on', S.st.low); $('#bLow').textContent = S.st.low ? 'Ridotte' : 'Alta'; tip(S.st.low ? 'Ridotte inserite: più forza, meno velocità' : 'Marce alte'); };
$('#bLR').onclick = () => { S.st.lockR = !S.st.lockR; $('#bLR').classList.toggle('on', S.st.lockR); tip(S.st.lockR ? 'Bloccaggio posteriore inserito' : 'Differenziale posteriore aperto'); };
$('#bLF').onclick = () => { S.st.lockF = !S.st.lockF; $('#bLF').classList.toggle('on', S.st.lockF); tip(S.st.lockF ? 'Bloccaggio anteriore inserito: sterza meno' : 'Differenziale anteriore aperto'); };
let camMode = 0; $('#bCam').onclick = () => { camMode = (camMode + 1) % 3; tip(['Dietro', 'Bassa sulle ruote', 'Di lato'][camMode]); };
$('#bVeh').onclick = () => { vehK = vehK === 'terrano' ? 'wrangler' : 'terrano'; $('#bVeh').textContent = 'Mezzo: ' + VEHS[vehK].n; reset(); };
$('#bRst').onclick = () => reset();
function reset(z) { const keep = S ? { low: S.st.low, lockR: S.st.lockR, lockF: S.st.lockF } : null; if (S) S.world.free(); S = makeSim(RAPIER, { veh: VEHS[vehK], start: { x: 0, z: z || 8 } }); if (keep) Object.assign(S.st, keep); if (!world3.children.length) buildWorld(); buildCar(); }
reset(); buildWorld(); $('#load').remove(); tip('Prova di fisica vera: ruote, ponti e ostacoli solidi');

// ---------- suono motore (gli stessi campioni del gioco) ----------
let AC = null, eng = null;
async function audio() { if (AC) return; AC = new (window.AudioContext || window.webkitAudioContext)(); const ld = async f => { try { return await AC.decodeAudioData(await (await fetch(f)).arrayBuffer()); } catch (e) { return null; } };
  const [a, b] = await Promise.all([ld('eng_idle.mp3'), ld('eng_load.mp3')]); if (!a || !b) return; const mk = buf => { const s = AC.createBufferSource(); s.buffer = buf; s.loop = true; const g = AC.createGain(); g.gain.value = 0; s.connect(g); g.connect(AC.destination); s.start(); return { s, g }; }; eng = { i: mk(a), l: mk(b) }; }

// ---------- ciclo ----------
let last = performance.now(), camP = new THREE.Vector3(0, 4, 0), camL = new THREE.Vector3();
function frame(now) {

  $('#wl').innerHTML = S.st.slip.map(s => `<span style="color:${s > .5 ? '#ff4d3a' : s > .2 ? '#f2c230' : '#7cc35a'}">●</span>`).join(' ');
  if (eng) { const k = S.st.rpmK, L = g; eng.i.s.playbackRate.value = .8 + k * 1.3; eng.l.s.playbackRate.value = .55 + k * 1.2; eng.i.g.gain.value = .7 * (1 - Math.min(1, k * 1.2 + L * .4)); eng.l.g.gain.value = Math.min(.8, k * .7 + L * .6); }
